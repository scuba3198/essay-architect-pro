<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#292524;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Border Accent -->
  <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#facc15" stroke-width="4"/>
  
  <!-- Logo/Icon -->
  <circle cx="200" cy="315" r="80" fill="#facc15" />
  <text x="200" y="345" font-family="serif" font-weight="900" font-size="100" fill="#1c1917" text-anchor="middle">E</text>

  <!-- Text -->
  <text x="320" y="300" font-family="serif" font-weight="900" font-size="80" fill="#ffffff" letter-spacing="2">ESSAY ARCHITECT</text>
  <text x="320" y="380" font-family="sans-serif" font-weight="bold" font-size="40" fill="#facc15" letter-spacing="8">PRO EDITION</text>
  
  <!-- Tagline -->
  <text x="600" y="520" font-family="sans-serif" font-size="24" fill="#a8a29e" text-anchor="middle" letter-spacing="2">THE AI-POWERED WRITING WIZARD FOR IELTS &amp; PTE</text>
</svg>
